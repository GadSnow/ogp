name: Deploy OGP Angular App

on:
  push:
    branches:
      - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run:
          docker build -t gadiry/ogp-web:latest .

      - name: Push Docker image
        run:
          docker push gadiry/ogp-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: babin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy/ogp-web

            docker pull gadiry/ogp-web:latest
            docker compose down

            docker compose up -d
            docker image prune -f
