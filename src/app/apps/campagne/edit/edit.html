<p-toast />

<div class="flex justify-center mt-4 mb-4">
    <div class="w-full md:w-5/6">
        <div class="card p-6 flex flex-col gap-5">
            <div class="text-xl font-semibold uppercase tracking-tight text-primary">Modifier la Campagne</div>

            @if (loadingData()) {
            <div class="flex flex-col gap-6">
                <p-skeleton width="100%" height="4rem"></p-skeleton>
                <p-skeleton width="100%" height="4rem"></p-skeleton>
                <p-skeleton width="100%" height="20rem"></p-skeleton>
            </div>
            } @else {
            <form [formGroup]="form">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Nom Campagne -->
                    <div class="flex flex-col gap-2">
                        <label for="nomCampagne">Nom de la Campagne</label>
                        <input id="nomCampagne" type="text" pInputText formControlName="nomCampagne" [class.ng-invalid]="isInvalid('nomCampagne')" [class.ng-dirty]="isInvalid('nomCampagne')" />
                        @if (isInvalid('nomCampagne')) { <small class="p-error">Le nom est obligatoire.</small> }
                    </div>

                    <!-- Client -->
                    <div class="flex flex-col gap-2">
                        <label for="idClient">Client</label>
                        @if (loadingClients()) {
                        <p-skeleton width="100%" height="3rem"></p-skeleton>
                        } @else {
                        <p-select
                            id="idClient"
                            [options]="clients"
                            optionLabel="denomination"
                            optionValue="id"
                            formControlName="idClient"
                            class="w-full"
                            [filter]="true"
                            filterBy="denomination,sigle"
                            [class.ng-invalid]="isInvalid('idClient')"
                            [class.ng-dirty]="isInvalid('idClient')"
                        ></p-select>
                        }
                    </div>

                    <!-- Date Début -->
                    <div class="flex flex-col gap-2">
                        <label for="dateDebut">Date de Début</label>
                        <p-datepicker id="dateDebut" formControlName="dateDebut" [showIcon]="true" class="w-full" [class.ng-invalid]="isInvalid('dateDebut')" [class.ng-dirty]="isInvalid('dateDebut')"></p-datepicker>
                    </div>

                    <!-- Date Fin -->
                    <div class="flex flex-col gap-2">
                        <label for="dateFin">Date de Fin</label>
                        <p-datepicker id="dateFin" formControlName="dateFin" [showIcon]="true" class="w-full" [class.ng-invalid]="isInvalid('dateFin')" [class.ng-dirty]="isInvalid('dateFin')"></p-datepicker>
                    </div>

                    <!-- Cycle -->
                    <div class="flex flex-col gap-2">
                        <label for="cycle">Cycle</label>
                        <input id="cycle" type="text" pInputText formControlName="cycle" [class.ng-invalid]="isInvalid('cycle')" [class.ng-dirty]="isInvalid('cycle')" />
                    </div>

                    <!-- Panneaux MultiSelect -->
                    <div class="flex flex-col gap-2">
                        <label for="selectedPanneaux">Panneaux concernés</label>
                        @if (loadingPanneaux()) {
                        <p-skeleton width="100%" height="3rem"></p-skeleton>
                        } @else {
                        <p-multiselect
                            id="selectedPanneaux"
                            [options]="panneaux"
                            formControlName="selectedPanneaux"
                            optionLabel="reference"
                            display="chip"
                            [filter]="true"
                            filterBy="reference"
                            class="w-full"
                            [class.ng-invalid]="isInvalid('selectedPanneaux')"
                            [class.ng-dirty]="isInvalid('selectedPanneaux')"
                        >
                        </p-multiselect>
                        }
                    </div>

                    <!-- Statut -->
                    <div class="flex flex-col gap-2">
                        <label for="statut">Statut</label>
                        @if (loadingStatuts()) {
                        <p-skeleton width="100%" height="3rem"></p-skeleton>
                        } @else {
                        <p-select id="statut" [options]="statuts" optionLabel="description" optionValue="codeStatut" formControlName="statut" class="w-full" [class.ng-invalid]="isInvalid('statut')" [class.ng-dirty]="isInvalid('statut')"></p-select>
                        } @if (isInvalid('statut')) { <small class="p-error">Le statut est obligatoire.</small> }
                    </div>
                </div>

                <!-- Description -->
                <div class="flex flex-col gap-2 mt-6">
                    <label for="description">Description</label>
                    <textarea id="description" pInputText formControlName="description" rows="3" class="w-full"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end gap-3 mt-8">
                    <p-button label="Annuler" severity="secondary" [outlined]="true" [routerLink]="['/ogp/campagne']" />
                    <p-button label="Sauvegarder les modifications" severity="primary" (onClick)="submit()" [disabled]="form.invalid || isLoading()" />
                </div>

                <p-confirmdialog />
            </form>
            }
        </div>
    </div>
</div>
