<p-confirmdialog />

<div custom-card>
    <h3 card-title>Gestion des Campagnes</h3>
    <div card-action>
        <p-button label="Nouvelle Campagne" size="small" icon="pi pi-plus" [routerLink]="['add']" />
    </div>

    <div>
        @if (isLoading()) {
            <app-skeleton-table [rows]="10" [columns]="6"></app-skeleton-table>
        } @else {
            <div class="mb-4 flex flex-wrap items-center gap-3 rounded-lg border bg-surface-50 dark:bg-surface-800 px-3.5 py-3">
                        <p-iconfield class="w-full sm:w-80">
                            <p-inputicon class="pi pi-search" />
                            <input pInputText type="text" class="w-full" placeholder="Rechercher" (input)="dt.filterGlobal($event.target.value, 'contains')" />
                        </p-iconfield>
                    </div>
            <p-table #dt [value]="campagnes" [rows]="10" [paginator]="true" [responsiveLayout]="'scroll'" [globalFilterFields]="['nomCampagne', 'client.denomination', 'client.sigle', 'statut']">
                <ng-template pTemplate="header">
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Client</th>
                        <th>Dates</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-camp let-rowIndex="rowIndex">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td class="font-bold text-primary cursor-pointer hover:underline" [routerLink]="['detail', camp.id]">{{ camp.nomCampagne }}</td>
                        <td>{{ camp.client?.denomination }} ({{ camp.client?.sigle }})</td>
                        <td>
                            <div class="flex flex-col text-xs font-medium">
                                <span>Du: {{ camp.dateDebut | date: 'dd/MM/yyyy' }}</span>
                                <span>Au: {{ camp.dateFin | date: 'dd/MM/yyyy' }}</span>
                            </div>
                        </td>
                        <td>
                            <p-tag [value]="camp.statut" [severity]="getSeverity(camp.statut)" />
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-pencil" [text]="true" [routerLink]="['edit', camp.id]" severity="secondary" size="small" />
                                <p-button icon="pi pi-trash" [text]="true" (onClick)="deleteCampagne(camp.id)" severity="danger" size="small" />
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="6" class="p-0">
                        <app-empty-state message="Aucune campagne trouvée" />
                    </td>
                    </tr>
                </ng-template>
            </p-table>
        }
    </div>
</div>
