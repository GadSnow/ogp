
<div class="flex justify-center mt-4">
    <div class="w-full md:w-4/5">
        <div class="card p-6 flex flex-col gap-5">

            <div class="text-xl font-semibold">Enregistrement</div>

            @if (isLoading()) {

                <!-- SKELETON -->
                <div class="flex flex-col gap-4">

                    <!-- Catégorie -->
                    <div class="flex flex-col gap-2">
                        <p-skeleton width="100px" height="1rem"></p-skeleton>
                        <p-skeleton width="100%" height="2.5rem"></p-skeleton>
                    </div>

                    <!-- Description -->
                    <div class="flex flex-col gap-2">
                        <p-skeleton width="120px" height="1rem"></p-skeleton>
                        <p-skeleton width="100%" height="6rem"></p-skeleton>
                    </div>

                    <!-- Button -->
                    <div class="flex justify-end">
                        <p-skeleton width="120px" height="2.5rem"></p-skeleton>
                    </div>

                </div>

            } @else {
                <form [formGroup]="form">

                    <!-- Catégorie -->
                    <div class="flex flex-col gap-2 mb-4">
                        <label for="categorie">Catégorie de panneaux</label>
                        <input
                            id="categorie"
                            type="text"
                            pInputText
                            fluid
                            formControlName="categorie"
                            [class.ng-invalid]="isInvalid('categorie')"
                            [class.ng-dirty]="isInvalid('categorie')"
                        />
                        @if (isInvalid('categorie')) {
                            <small class="p-error">La catégorie est requise.</small>
                        }
                    </div>

                    <!-- Description -->
                    <div class="flex flex-col gap-2 mb-4">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            pTextarea
                            rows="5"
                            class="w-full"
                            formControlName="description"
                            [class.ng-invalid]="isInvalid('description')"
                            [class.ng-dirty]="isInvalid('description')"
                        ></textarea>
                        @if (isInvalid('description')) {
                            <small class="p-error">La description est requise.</small>
                        }
                    </div>

                    <!-- Button -->
                    <div class="flex justify-end">
                        <p-button
                            label="Valider"
                            severity="primary"
                            (onClick)="submit()"
                            [disabled]="form.invalid"
                        />
                    </div>

                    <p-confirmdialog #cd>
                        <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
                            @if (message) {
                                <div class="flex flex-col items-center p-8 bg-surface-0 dark:bg-surface-900 rounded">
                                    <div class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20">
                                        <i class="pi pi-question !text-5xl"></i>
                                    </div>
                                    <span class="font-bold text-2xl block mb-2 mt-6">{{ message.header }}</span>
                                    <p class="mb-0">{{ message.message }}</p>
                                    <div class="flex items-center gap-2 mt-6">
                                        <p-button label="Oui, confirmer" (onClick)="onAccept()"></p-button>
                                        <p-button label="Annuler" [outlined]="true" (onClick)="onReject()" styleClass="w-32"></p-button>
                                    </div>
                                </div>
                            }
                        </ng-template>
                    </p-confirmdialog>

                </form>

            }
        </div>
    </div>
</div>
