<div custom-card>
    <h3 card-title>Gestion des Devis</h3>
    <div card-action>
        <p-button label="Nouveau Devis" size="small" icon="pi pi-plus" [routerLink]="['add']" />
    </div>

    <div>
        @if (isLoading()) {
            <app-skeleton-table [rows]="10" [columns]="5"></app-skeleton-table>
        } @else {
            <p-table [value]="devis" [rows]="10" [paginator]="true" [responsiveLayout]="'scroll'" styleClass="p-datatable-sm overflow-hidden">
                <ng-template pTemplate="header">
                    <tr>
                        <th>#</th>
                        <th>Campagne</th>
                        <th>Client</th>
                        <th>Remise</th>
                        <th>Date création</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-d let-rowIndex="rowIndex">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td>
                            <a [routerLink]="['detail', d.id]" class="text-primary hover:underline cursor-pointer font-medium">
                                {{ d.campagne?.nomCampagne }}
                            </a>
                        </td>
                        <td>{{ d.campagne?.client?.denomination }}</td>
                        <td>
                            @if (d.remise) {
                                <p-tag [value]="d.remise.typeRemise + ' — ' + d.remise.valeurRemise + '%'" severity="secondary" />
                            } @else {
                                <span class="text-surface-400 text-sm">—</span>
                            }
                        </td>
                        <td>{{ d.dtCreated | date:'dd/MM/yyyy HH:mm' }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-8 bg-surface-50 dark:bg-surface-900 border-b border-surface-200">
                            <i class="pi pi-inbox text-4xl text-surface-400 mb-3 block"></i>
                            <span class="text-surface-500 font-medium italic">Aucun devis trouvé.</span>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        }
    </div>
</div>
