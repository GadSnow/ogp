

<div custom-card>
    <h3 card-title>Modes de paiement</h3>
    <div card-action>
        <p-button label="Ajouter" [routerLink]="['add']" />
    </div>

    @if (isLoading()) {
        <app-skeleton-table></app-skeleton-table>
    } @else {
        <div>
            @if (modes.length > 0) {
                <div class="flex justify-end mb-3">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input pInputText type="text" placeholder="Rechercher" (input)="dt.filterGlobal($event.target.value, 'contains')" />
                    </p-iconfield>
                </div>
                <p-table #dt [value]="modes" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]"
                         [tableStyle]="{ 'min-width': '50rem' }" [globalFilterFields]="['mode', 'description']">
                    <ng-template #header>
                        <tr>
                            <th>#</th>
                            <th>Mode</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </ng-template>
                    <ng-template #body let-mode let-rowIndex="rowIndex">
                        <tr>
                            <td>{{ rowIndex + 1 }}</td>
                            <td>{{ mode.mode }}</td>
                            <td>{{ mode.description }}</td>
                            <td>
                                <p-button label="Modifier" [text]="true" size="small"
                                          [routerLink]="['edit', mode.id]" />

                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            } @else {
                <div class="bg-card flex justify-center items-center h-72">
                    <h1 class="font-bold text-3xl">Aucune donnée trouvée</h1>
                </div>
            }
        </div>
    }

</div>
