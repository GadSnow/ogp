<p-toast />

<div>
    <div custom-card>
        <h3 card-title>Profils</h3>
        <div card-action>
            <p-button label="Ajouter" [routerLink]="['add']" />
        </div>

        @if (isLoading()) {
        <app-skeleton-table></app-skeleton-table>
        } @else {
        <div>
            @if (profils.length > 0) {
            <div class="mb-4 flex flex-wrap items-center gap-3 rounded-lg border bg-surface-50 dark:bg-surface-800 px-3.5 py-3">
                        <p-iconfield class="w-full sm:w-80">
                            <p-inputicon class="pi pi-search" />
                            <input pInputText type="text" class="w-full" placeholder="Rechercher" (input)="dt.filterGlobal($event.target.value, 'contains')" />
                        </p-iconfield>
                    </div>
            <p-table #dt [value]="profils" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [tableStyle]="{ 'min-width': '50rem' }" [globalFilterFields]="['profil']">
                <ng-template #header>
                    <tr>
                        <th>#</th>
                        <th>Profil</th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template #body let-profil let-rowIndex="rowIndex">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td>
                            <a [routerLink]="['detail', profil.id]" class="text-primary hover:underline cursor-pointer font-medium">
                                {{ profil.profil }}
                            </a>
                        </td>
                        <td class="flex gap-2">
                            <p-button icon="pi pi-pencil" severity="secondary" pTooltip="Modifier" tooltipPosition="top" ariaLabel="Modifier" [text]="true" size="small" [routerLink]="['edit', profil.id]" />
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            } @else {
            <app-empty-state message="Aucun profil trouvé" />
            }
        </div>
        }
    </div>


</div>
