
<div class="flex justify-center mt-4">
    <div class="w-full md:w-4/5">
        <div class="card p-6 flex flex-col gap-5">

            <div class="text-base font-semibold text-surface-900 dark:text-surface-0 pb-3 border-b">Enregistrement</div>

            @if (isLoading()) {

                <!-- SKELETON -->
                <div class="flex flex-col gap-4">

                    <!-- Région -->
                    <div class="flex flex-col gap-2">
                        <p-skeleton width="100px" height="1rem"></p-skeleton>
                        <p-skeleton width="100%" height="2.5rem"></p-skeleton>
                    </div>

                    <!-- Button -->
                    <div class="flex justify-end">
                        <p-skeleton width="120px" height="2.5rem"></p-skeleton>
                    </div>

                </div>

            } @else {
                <form [formGroup]="form">

                    <!-- Région -->
                    <div class="flex flex-col gap-2 mb-4">
                        <label for="region">Région</label>
                        <input
                            id="region"
                            type="text"
                            pInputText
                            fluid
                            formControlName="region"
                            [class.ng-invalid]="isInvalid('region')"
                            [class.ng-dirty]="isInvalid('region')"
                        />
                        @if (isInvalid('region')) {
                            <small class="p-error">La région est requise.</small>
                        }
                    </div>

                    <!-- Button -->
                    <div class="flex justify-end">
                        <p-button
                            label="Valider"
                            severity="primary"
                            (onClick)="submit()"
                            [disabled]="form.invalid"
                        />
                    </div>


</form>

            }
        </div>
    </div>
</div>
