

<div>
    <div custom-card>
        <h3 card-title>Régions</h3>
        <div card-action>
            <p-button label="Ajouter" [routerLink]="['add']" />
        </div>

        @if (isLoading()) {
            <app-skeleton-table></app-skeleton-table>
        } @else {
            <div>
                @if (regions.length > 0) {
                    <p-table [value]="regions" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]"
                             [tableStyle]="{ 'min-width': '50rem' }">
                        <ng-template #header>
                            <tr>
                                <th>#</th>
                                <th>Région</th>
                                <th>Action</th>
                            </tr>
                        </ng-template>
                        <ng-template #body let-region let-rowIndex="rowIndex">
                            <tr>
                                <td>{{ rowIndex + 1 }}</td>
                                <td>{{ region.region }}</td>
                                <td>
                                    <p-button label="Modifier" [text]="true" size="small"
                                              [routerLink]="['edit', region.id]" />

                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                } @else {
                    <div class="bg-card flex justify-center items-center h-72">
                        <h1 class="font-bold text-3xl">Aucune donnée trouvée</h1>
                    </div>
                }
            </div>
        }
    </div>
</div>
