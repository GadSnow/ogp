<p-toast />

<div>
    <div custom-card>
        <h3 card-title>Utilisateurs</h3>
        <div card-action>
            <p-button label="Ajouter" [routerLink]="['add']" />
        </div>

        @if (isLoading()) {
        <app-skeleton-table></app-skeleton-table>
        } @else {
        <div>
            @if (users.length > 0) {
            <div class="mb-4 flex flex-wrap items-center gap-3 rounded-lg border bg-surface-50 dark:bg-surface-800 px-3.5 py-3">
                        <p-iconfield class="w-full sm:w-80">
                            <p-inputicon class="pi pi-search" />
                            <input pInputText type="text" class="w-full" placeholder="Rechercher" (input)="dt.filterGlobal($event.target.value, 'contains')" />
                        </p-iconfield>
                    </div>
            <p-table #dt [value]="users" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [tableStyle]="{ 'min-width': '50rem' }" [globalFilterFields]="['nom', 'prenom', 'email', 'msisdn', 'role', 'profils.profil']">
                <ng-template #header>
                    <tr>
                        <th>#</th>
                        <th>Nom & Prénom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                        <th>Profil</th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template #body let-user let-rowIndex="rowIndex">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td>
                            <a [routerLink]="['detail', user.id]" class="text-primary hover:underline cursor-pointer font-medium">
                                {{ user.nom }} {{ user.prenom }}
                            </a>
                        </td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.msisdn }}</td>
                        <td>{{ user.role }}</td>
                        <td>{{ user.profils?.profil }}</td>
                        <td class="flex gap-2">
                            <p-button icon="pi pi-pencil" severity="secondary" pTooltip="Modifier" tooltipPosition="top" ariaLabel="Modifier" [text]="true" size="small" [routerLink]="['edit', user.id]" />
                            <p-button label="Supprimer" [text]="true" size="small" severity="danger" (onClick)="deleteUser(user.id)" />
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            } @else {
            <app-empty-state message="Aucun utilisateur trouvé" />
            }
        </div>
        }
    </div>

    <p-confirmdialog />
</div>
