<p-toast />

<div>
    <div custom-card>
        <h3 card-title>Utilisateurs</h3>
        <div card-action>
            <p-button label="Ajouter" [routerLink]="['add']" />
        </div>

        @if (isLoading()) {
        <app-skeleton-table></app-skeleton-table>
        } @else {
        <div>
            @if (users.length > 0) {
            <p-table [value]="users" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template #header>
                    <tr>
                        <th>#</th>
                        <th>Nom & Prénom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                        <th>Profil</th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template #body let-user let-rowIndex="rowIndex">
                    <tr>
                        <td>{{ rowIndex + 1 }}</td>
                        <td>
                            <a [routerLink]="['detail', user.id]" class="text-primary hover:underline cursor-pointer font-medium">
                                {{ user.nom }} {{ user.prenom }}
                            </a>
                        </td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.msisdn }}</td>
                        <td>{{ user.role }}</td>
                        <td>{{ user.profils?.profil }}</td>
                        <td class="flex gap-2">
                            <p-button label="Modifier" [text]="true" size="small" [routerLink]="['edit', user.id]" />
                            <p-button label="Supprimer" [text]="true" size="small" severity="danger" (onClick)="deleteUser(user.id)" />
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            } @else {
            <div class="bg-card flex justify-center items-center h-72">
                <h1 class="font-bold text-3xl">Aucun utilisateur trouvé</h1>
            </div>
            }
        </div>
        }
    </div>

    <p-confirmdialog />
</div>
